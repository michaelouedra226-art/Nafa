name: Compilation APK Android (Release & Debug)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type de build Android'
        required: true
        default: 'both'
        type: choice
        options:
          - 'debug'
          - 'release'
          - 'both'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source (Checkout)
        uses: actions/checkout@v4

      - name: Configuration de Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configuration du SDK Android & Acceptation des Licences
        uses: android-actions/setup-android@v3

      - name: Acceptation des licences & installation packages Android SDK (API 36 & 35)
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "platform-tools" || true

      - name: Configuration de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configuration de Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installation des dépendances NPM
        run: npm ci || npm install

      - name: Compilation de l'application web (Vite production)
        run: npm run build:client
        env:
          NODE_ENV: production

      - name: Synchronisation Capacitor Android
        run: npx cap sync android

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Compilation APKs Android via Gradle
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Préparation et renommage des fichiers APK
        run: |
          mkdir -p build-apks
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-apks/NAFA-debug.apk
          fi
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-apks/NAFA-release.apk
          fi
          ls -la build-apks/

      - name: Téléversement des artefacts APK sur GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: nafa-android-apks
          path: build-apks/*.apk
          retention-days: 30

      - name: Publication de la Release GitHub avec Liens de Téléchargement Directs
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('NAFA Version {0}', github.ref_name) || 'NAFA APK (Dernière version disponible)' }}
          body: |
            ## NAFA — Application Android
            
            Téléchargement direct des fichiers APK prêts à l'installation :
            
            - **[Télécharger NAFA-debug.apk (Recommandé - Installation directe)](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0-latest' }}/NAFA-debug.apk)**
            - **[Télécharger NAFA-release.apk](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0-latest' }}/NAFA-release.apk)**
            
            ### Guide d'installation sur votre smartphone Android :
            1. Cliquez sur le lien direct ci-dessus pour télécharger `NAFA-debug.apk`.
            2. Ouvrez le fichier `.apk` téléchargé sur votre smartphone.
            3. Si Android vous demande confirmation, autorisez l'installation d'applications issues de cette source.
            4. Ouvrez l'application NAFA.
          files: build-apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

