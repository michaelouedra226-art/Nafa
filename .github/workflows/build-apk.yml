name: Compilation APK Android

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type de build Android'
        required: true
        default: 'debug'
        type: choice
        options:
          - 'debug'
          - 'release'
          - 'both'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || (startsWith(github.ref, 'refs/tags/') && 'release' || 'debug') }}

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v7

      - name: Configuration de Java JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configuration du SDK Android
        uses: android-actions/setup-android@v4

      - name: Installation des composants Android nécessaires
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Configuration de Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installation reproductible des dépendances
        run: npm ci

      - name: Compilation de l'application web
        run: npm run build:client
        env:
          NODE_ENV: production

      - name: Synchronisation Capacitor Android
        run: npx cap sync android

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Préparer la signature privée pour le build release
        if: env.BUILD_TYPE == 'release' || env.BUILD_TYPE == 'both'
        env:
          KEYSTORE_BASE64: ${{ secrets.NAFA_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.NAFA_ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.NAFA_ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NAFA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEY_ALIAS" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "Un build release signé nécessite les secrets NAFA_ANDROID_KEYSTORE_BASE64, NAFA_ANDROID_KEY_ALIAS, NAFA_ANDROID_STORE_PASSWORD et NAFA_ANDROID_KEY_PASSWORD." >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/nafa-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "NAFA_RELEASE_STORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo "NAFA_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NAFA_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NAFA_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Compilation APK via Gradle
        working-directory: android
        env:
          GRADLE_OPTS: -Xmx2g -Dorg.gradle.daemon=false
          BUILD_TYPE: ${{ env.BUILD_TYPE }}
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --no-daemon
          if [[ "$BUILD_TYPE" == "release" || "$BUILD_TYPE" == "both" ]]; then
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Préparation des artefacts APK
        run: |
          set -euo pipefail
          mkdir -p build-apks
          cp android/app/build/outputs/apk/debug/app-debug.apk build-apks/NAFA-debug.apk
          if [[ "$BUILD_TYPE" == "release" || "$BUILD_TYPE" == "both" ]]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-apks/NAFA-release.apk
          fi
          ls -lh build-apks/

      - name: Téléversement des artefacts temporaires du workflow
        uses: actions/upload-artifact@v7
        with:
          name: nafa-android-apks-${{ github.run_number }}
          path: build-apks/*.apk
          retention-days: 30
