name: Build & Verification GitHub

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilation, tests et types
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code (Checkout)
        uses: actions/checkout@v7

      - name: Configuration de Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installation reproductible des dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Vérification TypeScript
        run: npm run lint

      - name: Compilation production (Vite + esbuild)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Sauvegarde des artefacts compilés
        uses: actions/upload-artifact@v7
        with:
          name: nafa-production-dist
          path: dist/
          retention-days: 7
